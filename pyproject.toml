[project]
name = "localragapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Boyle", email = "james.b@jimpip.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
]

[project.scripts]
localragapi = "localragapi:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "localrag"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
